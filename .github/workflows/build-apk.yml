name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 刻意不用 android-actions/setup-android：ubuntu-latest 运行镜像**自带** Android SDK
      # （ANDROID_HOME 已设、licenses 已接受），而那个 action 常在下载 cmdline-tools 时失败，
      # 一挂后面全被跳过。这里只做 best-effort 补组件，缺了 Gradle 也会自己拉。
      - name: 准备 SDK 组件（best-effort）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="sdkmanager"
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 debug APK
        env:
          # 固定签名（缺失时 build.gradle 自动回退到默认调试签名，不会失败）
          DSHPET_KEYSTORE_BASE64: ${{ secrets.DSHPET_KEYSTORE_BASE64 }}
          DSHPET_KEYSTORE_PASSWORD: ${{ secrets.DSHPET_KEYSTORE_PASSWORD }}
          DSHPET_KEY_ALIAS: ${{ secrets.DSHPET_KEY_ALIAS }}
          DSHPET_KEY_PASSWORD: ${{ secrets.DSHPET_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 把 APK 的签名指纹发成 ::notice::（注解免登录可读）——
      # 用来确认"这次构建到底用了固定签名还是默认调试签名"（两者指纹不同）
      - name: 显示 APK 签名指纹
        if: success()
        run: |
          APKS=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          [ -x "$SIGNER" ] || SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1)
          if [ -x "$SIGNER" ]; then
            SIG=$("$SIGNER" verify --print-certs "$APKS" 2>/dev/null | grep -m1 -i 'SHA-256 digest' || echo 'unknown')
          else
            SIG='apksigner 不可用'
          fi
          SUFFIX="（固定签名已启用）"
          [ -n "$DSHPET_KEYSTORE_BASE64" ] || SUFFIX="（未配置固定签名，用的是默认调试签名）"
          echo "::notice::APK 签名 $SIG $SUFFIX"
          [ -n "$DSHPET_KEYSTORE_BASE64" ] || echo "::warning::未配置 DSHPET_KEYSTORE_BASE64 —— 本次 APK 不能覆盖安装"

      # Actions 的原始日志要登录才能下载；::error:: 会被 GitHub 变成"检查注解"，
      # 而注解是免登录可读的（这一条纯粹是为了让自动排障能拿到编译错误）
      - name: 失败时把编译错误发成 annotation
        if: failure()
        run: |
          {
            echo '## 构建失败：关键错误行'
            echo '```'
            grep -nE "error:|Cannot find symbol|symbol:|location:|What went wrong|Execution failed|\.java:[0-9]+" "$RUNNER_TEMP/build.log" | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|Cannot find symbol|symbol:|location:|What went wrong|Execution failed|\.java:[0-9]+" "$RUNNER_TEMP/build.log" \
            | head -24 | while IFS= read -r line; do echo "::error::$line"; done

      - name: 上传 APK（Actions 里可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-mobile-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 顺便发一个 Release（手机上点链接就能装）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="apk-$(date +%Y%m%d-%H%M%S)"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --title "dsh-pet 手机版 $tag" \
            --notes "自动构建的安装包（debug 签名，自己用足够）。手机浏览器点下面的 .apk 直接下载安装即可。"
