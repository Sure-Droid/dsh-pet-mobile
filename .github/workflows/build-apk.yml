name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 刻意不用 android-actions/setup-android：ubuntu-latest 运行镜像**自带** Android SDK
      # （ANDROID_HOME 已设、licenses 已接受），而那个 action 常在下载 cmdline-tools 时失败，
      # 一挂后面全被跳过。这里只做 best-effort 补组件，缺了 Gradle 也会自己拉。
      - name: 准备 SDK 组件（best-effort）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="sdkmanager"
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Actions 的原始日志要登录才能下载；把关键错误行汇总到 job summary 里就能免登录读到
      - name: 失败时把编译错误写进 job summary
        if: failure()
        run: |
          {
            echo '## 构建失败：关键错误行'
            echo '```'
            grep -nE "error:|What went wrong|Execution failed|> Task .* FAILED|\.java:[0-9]+|Cannot find symbol|symbol:|location:" "$RUNNER_TEMP/build.log" | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK（Actions 里可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-mobile-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 顺便发一个 Release（手机上点链接就能装）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="apk-$(date +%Y%m%d-%H%M%S)"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --title "dsh-pet 手机版 $tag" \
            --notes "自动构建的安装包（debug 签名，自己用足够）。手机浏览器点下面的 .apk 直接下载安装即可。"
