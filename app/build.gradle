// dsh-pet 手机版（Android 悬浮桌宠）
//
// 设计取向：**一行不改地复用插件自己的渲染端**（runtime/electron-helper 的
// shared-core/constants/sprite/events/renderer），Android 侧只做三件事：
//   1. 一个悬浮窗（TYPE_APPLICATION_OVERLAY），窗口尺寸/位置完全照渲染端上报的
//      petBridge.setBounds(x, y, width, height, ...) 来设（与 Electron 主进程同一公式）；
//   2. 一个只绑 127.0.0.1 的本地小 HTTP 服务，把打包进 assets 的素材按宿主原来的
//      URL 结构（/dsh-pet-7340/thumb/main/x.webm 等）回给 WebView —— 这样渲染端
//      连 URL 拼装都不用改；
//   3. petBridge 的 JS 接口（setBounds/setInteractive 等）。
plugins {
  id 'com.android.application'
}

// ---------------------------------------------------------------------------
// 固定签名（可选但推荐）
//   CI 通过仓库 secret 注入 keystore 的 base64 与口令；本地/未配置时**自动回退**到
//   Android 默认调试签名，构建不会因为缺 secret 而失败。
//   有了固定签名，CI 每次产出的 APK 签名一致 —— 手机上可以直接**覆盖安装**，
//   不用卸载（否则每次都要重填 API Key 与设置）。
// ---------------------------------------------------------------------------
def dshpetKsB64 = System.getenv('DSHPET_KEYSTORE_BASE64')
def dshpetKsPass = System.getenv('DSHPET_KEYSTORE_PASSWORD')
def dshpetKsAlias = System.getenv('DSHPET_KEY_ALIAS')
def dshpetKsKeyPass = System.getenv('DSHPET_KEY_PASSWORD') ?: dshpetKsPass
def hasStableSigning = dshpetKsB64 && dshpetKsPass && dshpetKsAlias
def dshpetKeystoreFile = null
if (hasStableSigning) {
  // 落在 build/ 下（.gitignore 已忽略），不会进仓库
  dshpetKeystoreFile = file("$rootDir/build/dshpet-signing.p12")
  dshpetKeystoreFile.parentFile.mkdirs()
  dshpetKeystoreFile.bytes = java.util.Base64.getDecoder().decode(dshpetKsB64.replaceAll('\\s', ''))
}

android {
  namespace 'com.dshpet.mobile'
  compileSdk 34

  signingConfigs {
    if (hasStableSigning) {
      stable {
        storeFile dshpetKeystoreFile
        storePassword dshpetKsPass
        keyAlias dshpetKsAlias
        keyPassword dshpetKsKeyPass
      }
    }
  }

  defaultConfig {
    applicationId 'com.dshpet.mobile'
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName '0.1.0'
  }

  // 动画是 webm/png/ttf：再压缩没意义，还会拖慢构建
  androidResources {
    noCompress += ['webm', 'png', 'ttf']
  }

  buildTypes {
    release {
      minifyEnabled false
      // 自己用：没配固定签名时就用 debug 签名，省掉 keystore 配置
      if (hasStableSigning) {
        signingConfig signingConfigs.stable
      } else {
        signingConfig signingConfigs.debug
      }
    }
    debug {
      // 固定签名存在时，debug 包也用它 —— 这样每次 CI 产出的 APK 签名一致，
      // 手机上**直接覆盖安装**即可，不用卸载（key 与设置都不会丢）。
      if (hasStableSigning) {
        signingConfig signingConfigs.stable
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// 刻意不用任何依赖（包括 AndroidX）：少一层解析，构建更快、更不容易炸
dependencies { }
